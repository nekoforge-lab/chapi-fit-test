name: Chapi Fit automated checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Node and browser regression checks
        run: python run_checks.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapi-fit-test-evidence
          path: artifacts/
          if-no-files-found: warn
